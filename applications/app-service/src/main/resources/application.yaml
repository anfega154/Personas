server:
  port: 8091
spring:
  application:
    name: "Personas"
  devtools:
    add-properties: false
  h2:
    console:
      enabled: true
      path: "/h2"
  profiles:
    include: null
adapters:
  r2dbc:
    host: "localhost"
    port: 5435
    database: "user"
    schema: "public"
    username: "postgres"
    password: "postgres"
routers:
  paths:
    enrollBootcamps: "/api/v1/personas/enrollBootcamps"
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"
